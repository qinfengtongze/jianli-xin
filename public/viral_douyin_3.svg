<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="foldScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#27272A" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="360" height="640" fill="url(#bg3)" rx="16" />

  <!-- City street background blur -->
  <rect x="0" y="40" width="360" height="300" fill="#2563EB" opacity="0.3" filter="blur(10px)"/>

  <!-- Top status bar -->
  <text x="20" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">17:53</text>
  <text x="310" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">5G 95%</text>

  <!-- Big Foldable Phone X Fold6 held in hands -->
  <g transform="translate(45, 120)">
    <!-- Unfolded square-ish tablet phone -->
    <rect x="0" y="0" width="220" height="230" rx="16" fill="url(#foldScreen)" stroke="#94A3B8" stroke-width="2" />
    <!-- Center hinge line -->
    <line x1="110" y1="0" x2="110" y2="230" stroke="#52525B" stroke-width="1.5" stroke-dasharray="4 2"/>

    <!-- Screen viewfinder showing portrait photo of smiling girl -->
    <rect x="10" y="10" width="200" height="210" rx="10" fill="#1E1B4B" />
    
    <!-- Girl portrait inside screen -->
    <circle cx="110" cy="100" r="50" fill="#F43F5E" opacity="0.8" />
    <!-- Girl face -->
    <circle cx="110" cy="95" r="30" fill="#FDE047" opacity="0.9"/>
    <!-- Red lipstick -->
    <ellipse cx="110" cy="108" rx="8" ry="4" fill="#DC2626"/>
    <!-- Hair framing -->
    <path d="M 75 90 C 70 50, 150 50, 145 90 Q 130 130, 75 90 Z" fill="#1E293B"/>

    <!-- Viewfinder UI crosshairs -->
    <rect x="90" y="75" width="40" height="40" fill="none" stroke="#FACC15" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Hands holding phone sides -->
    <path d="M -25 90 C -10 80, 0 100, 5 120 C 0 160, -20 180, -35 150 Z" fill="#E2A988"/>
    <path d="M 245 90 C 230 80, 220 100, 215 120 C 220 160, 240 180, 255 150 Z" fill="#E2A988"/>
  </g>

  <!-- Overlay Text & Subtitles -->
  <text x="30" y="415" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" font-weight="800" fill="#FFF">机圈大事件 · 06-26</text>
  <text x="30" y="438" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="bold" fill="#FFF">还好有X Fold6 #人类对折叠屏的</text>
  <text x="30" y="458" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="14" font-weight="bold" fill="#FFF">开发不足百分之一 #vivoXFold6</text>

  <rect x="20" y="480" width="180" height="42" rx="12" fill="rgba(0,0,0,0.55)" />
  <text x="32" y="498" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11" fill="#E2E8F0">长安彼氏:</text>
  <text x="32" y="514" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11" font-weight="600" fill="#FFF">打游戏会不会很重 🎮</text>

  <!-- Right sidebar buttons -->
  <g transform="translate(305, 260)">
    <circle cx="20" cy="20" r="18" fill="#FFDC00" stroke="#FFF" stroke-width="2"/>
    <text x="20" y="24" font-size="9" font-weight="bold" fill="#000" text-anchor="middle">机圈</text>

    <path d="M 20 70 C 10 55, 0 70, 20 88 C 40 70, 30 55, 20 70 Z" fill="#FFF"/>
    <text x="20" y="102" font-size="10" font-weight="600" fill="#FFF" text-anchor="middle">6559</text>

    <circle cx="20" cy="130" r="14" fill="#FFF"/>
    <text x="20" y="156" font-size="10" font-weight="600" fill="#FFF" text-anchor="middle">123</text>

    <polygon points="20,175 24,188 38,188 27,196 31,210 20,201 9,210 13,196 2,188 16,188" fill="#FFF"/>
    <text x="20" y="224" font-size="10" font-weight="600" fill="#FFF" text-anchor="middle">392</text>
  </g>

  <!-- Bottom metric pill -->
  <rect x="0" y="595" width="360" height="45" fill="rgba(15, 23, 42, 0.9)" />
  <path d="M 20 617 L 30 611 L 30 623 Z" fill="#818CF8"/>
  <text x="38" y="621" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" fill="#818CF8">233.7万 浏览</text>
  
  <rect x="270" y="605" width="75" height="26" rx="6" fill="#4F46E5" />
  <text x="307" y="622" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle">折叠大屏</text>
</svg>
