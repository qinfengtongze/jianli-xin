<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="100%" height="100%">
  <defs>
    <!-- Background Gradient resembling warm indoor studio lighting -->
    <linearGradient id="bg_y600" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D2319"/>
      <stop offset="40%" stop-color="#403328"/>
      <stop offset="70%" stop-color="#211812"/>
      <stop offset="100%" stop-color="#0F0C0A"/>
    </linearGradient>
    
    <radialGradient id="lamp_glow" cx="15%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#FFB74D" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFB74D" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="skin_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCE0D6"/>
      <stop offset="50%" stop-color="#E8BCAD"/>
      <stop offset="100%" stop-color="#D4A091"/>
    </linearGradient>

    <linearGradient id="shirt_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="360" height="640" fill="url(#bg_y600)" rx="16"/>

  <!-- Warm Background Studio Light Glow -->
  <rect x="0" y="100" width="160" height="300" fill="url(#lamp_glow)"/>

  <!-- Top Status Bar -->
  <g fill="#FFFFFF" opacity="0.95">
    <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">17:53</text>
    <text x="282" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">5G  95%</text>
    <!-- Top left back arrow & search icon -->
    <path d="M 16 48 L 24 56 L 16 64" stroke="#FFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="330" cy="56" r="8" fill="none" stroke="#FFF" stroke-width="2"/>
    <line x1="336" y1="62" x2="342" y2="68" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Presenter Real Person Shot (Asian man with glasses & white shirt) -->
  <g transform="translate(180, 360)">
    <!-- Shoulders & Body -->
    <path d="M -130 150 C -120 30, -80 -20, -50 -40 C 0 -50, 0 -50, 50 -40 C 80 -20, 120 30, 130 150 Z" fill="url(#shirt_grad)"/>
    
    <!-- T-shirt Collar & Mascot Graphic -->
    <path d="M -40 -35 C -20 -15, 20 -15, 40 -35" stroke="#CBD5E1" stroke-width="3" fill="none"/>
    <rect x="35" y="20" width="18" height="18" rx="3" fill="#334155" opacity="0.8"/>

    <!-- Clip-on Microphone -->
    <rect x="-10" y="-18" width="18" height="22" fill="#0F172A" rx="4"/>
    <text x="-1" y="-5" font-size="5" fill="#FFF" font-family="sans-serif" font-weight="bold" text-anchor="middle">MOMA</text>

    <!-- Neck -->
    <path d="M -25 -70 L -25 -30 C -10 -20, 10 -20, 25 -30 L 25 -70 Z" fill="url(#skin_grad)"/>

    <!-- Head & Face -->
    <path d="M -42 -140 C -45 -190, 45 -190, 42 -140 C 40 -85, -40 -85, -42 -140 Z" fill="url(#skin_grad)"/>

    <!-- Hair -->
    <path d="M -48 -145 C -45 -205, 45 -205, 48 -145 C 35 -180, -35 -180, -48 -145 Z" fill="#1A181B"/>
    <path d="M -45 -155 Q -20 -195, 10 -185 Q 35 -195, 45 -155 Q 15 -170, -45 -155 Z" fill="#2D282A"/>

    <!-- Glasses Frame & Eyes -->
    <rect x="-36" y="-140" width="30" height="22" rx="4" fill="none" stroke="#1E293B" stroke-width="2.5"/>
    <rect x="6" y="-140" width="30" height="22" rx="4" fill="none" stroke="#1E293B" stroke-width="2.5"/>
    <line x1="-6" y1="-130" x2="6" y2="-130" stroke="#1E293B" stroke-width="2"/>
    <circle cx="-21" cy="-129" r="3.5" fill="#0F172A"/>
    <circle cx="21" cy="-129" r="3.5" fill="#0F172A"/>

    <!-- Nose & Mouth -->
    <path d="M -2 -120 L 0 -110 L 4 -112" stroke="#B88A7D" stroke-width="1.8" fill="none"/>
    <path d="M -10 -98 C -3 -95, 3 -95, 10 -98" stroke="#A86B5C" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Comment Bubble Overlay -->
  <g transform="translate(16, 422)">
    <rect x="0" y="0" width="250" height="58" rx="16" fill="rgba(30, 30, 35, 0.76)"/>
    <circle cx="20" cy="22" r="11" fill="#64748B"/>
    <text x="38" y="20" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11" fill="#A1A1AA">香喷喷的奶茶:</text>
    <text x="38" y="37" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF">真心觉得什么高刷、什么2K</text>
    <text x="38" y="51" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF">屏，都不如续航长和不怕摔</text>
  </g>

  <!-- Subtitle Text Overlay -->
  <text x="16" y="504" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="18" font-weight="900" fill="#FFFFFF" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.9))">Y600 Turbo也拿出了解决方案..</text>

  <!-- Related Search Tag -->
  <g transform="translate(16, 560)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0">🔍 相关搜索 · vivoY600Turbo</text>
  </g>

  <!-- Right Sidebar Engagement Controls -->
  <g transform="translate(302, 230)">
    <!-- Avatar -->
    <circle cx="20" cy="20" r="18" fill="#FFDC00" stroke="#FFF" stroke-width="2"/>
    <text x="20" y="24" font-size="9" font-weight="900" fill="#000" text-anchor="middle">机圈</text>

    <!-- Like -->
    <path d="M 20 70 C 10 55, 0 70, 20 88 C 40 70, 30 55, 20 70 Z" fill="#FFF"/>
    <text x="20" y="100" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#FFF" text-anchor="middle">1.5万</text>

    <!-- Comment -->
    <circle cx="20" cy="128" r="12" fill="#FFF"/>
    <text x="20" y="152" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#FFF" text-anchor="middle">801</text>

    <!-- Star Favorite -->
    <polygon points="20,174 24,184 35,184 26,191 29,202 20,195 11,202 14,191 5,184 16,184" fill="#FFF"/>
    <text x="20" y="216" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#FFF" text-anchor="middle">1855</text>
  </g>

  <!-- Bottom Toolbar Banner (PROMINENT PLAY COUNT AT BOTTOM - GUARANTEED UNCOLLIDED) -->
  <g transform="translate(0, 588)">
    <rect width="360" height="52" fill="#0A0B10"/>
    <line x1="0" y1="0" x2="360" y2="0" stroke="#27272A" stroke-width="1"/>
    
    <!-- Play Count -->
    <path d="M 16 26 L 26 19 L 26 33 Z" fill="#FFFFFF"/>
    <text x="32" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">445.6万浏览</text>

    <!-- Video Analysis Pill -->
    <rect x="156" y="12" width="130" height="28" rx="8" fill="#27272A"/>
    <text x="221" y="30" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11" font-weight="700" fill="#E4E4E7" text-anchor="middle">📊 视频分析  ^</text>

    <!-- Public Badge -->
    <rect x="294" y="12" width="52" height="28" rx="8" fill="#27272A"/>
    <text x="320" y="30" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11" font-weight="700" fill="#E4E4E7" text-anchor="middle">公开</text>
  </g>
</svg>
