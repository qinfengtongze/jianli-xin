<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="40%" stop-color="#0369A1" />
      <stop offset="100%" stop-color="#0C4A6E" />
    </linearGradient>
    <linearGradient id="waterStage" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" opacity="0.6"/>
      <stop offset="50%" stop-color="#7DD3FC" opacity="0.9"/>
      <stop offset="100%" stop-color="#38BDF8" opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="360" height="640" fill="url(#bg4)" rx="16" />

  <!-- Ocean Water Stage effect -->
  <ellipse cx="180" cy="380" rx="200" ry="60" fill="url(#waterStage)" />
  <circle cx="100" cy="360" r="4" fill="#FFF" opacity="0.8"/>
  <circle cx="260" cy="370" r="6" fill="#FFF" opacity="0.9"/>
  <circle cx="180" cy="350" r="5" fill="#FFF" opacity="0.7"/>

  <!-- Top status bar -->
  <text x="20" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">17:54</text>
  <text x="310" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">5G 95%</text>

  <!-- Celebrity (田曦薇) on stage in elegant dress -->
  <g transform="translate(180, 260)">
    <!-- Sparkling Dress -->
    <path d="M -30 20 Q -40 80, -60 120 Q 0 130, 60 120 Q 40 80, 30 20 Z" fill="#E2E8F0" opacity="0.9" />
    <path d="M -25 20 Q -10 -10, 0 -20 Q 10 -10, 25 20 Z" fill="#FCE7F3" />
    
    <!-- Face & Long Hair -->
    <ellipse cx="0" cy="-45" rx="16" ry="20" fill="#FDE047" opacity="0.9" />
    <path d="M -25 -50 Q -30 20, -15 60 Q 0 -30, 25 -50 Q 30 20, 15 60 Z" fill="#1E293B" />
    
    <!-- Hands holding slim vivo S60 phone -->
    <rect x="-8" y="0" width="16" height="28" rx="4" fill="#E2E8F0" stroke="#0284C7" stroke-width="1.5" />
  </g>

  <!-- Overlay text & subtitles -->
  <rect x="20" y="450" width="230" height="52" rx="14" fill="rgba(0,0,0,0.55)" />
  <text x="32" y="468" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11" fill="#E2E8F0">机圈大事件 · 05-29</text>
  <text x="32" y="488" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="12" font-weight="bold" fill="#FFF">vivo S60发布会小田 #田曦薇 现场</text>

  <!-- Right sidebar buttons -->
  <g transform="translate(305, 260)">
    <circle cx="20" cy="20" r="18" fill="#FFDC00" stroke="#FFF" stroke-width="2"/>
    <text x="20" y="24" font-size="9" font-weight="bold" fill="#000" text-anchor="middle">机圈</text>

    <path d="M 20 70 C 10 55, 0 70, 20 88 C 40 70, 30 55, 20 70 Z" fill="#FFF"/>
    <text x="20" y="102" font-size="10" font-weight="600" fill="#FFF" text-anchor="middle">5.3万</text>

    <circle cx="20" cy="130" r="14" fill="#FFF"/>
    <text x="20" y="156" font-size="10" font-weight="600" fill="#FFF" text-anchor="middle">605</text>

    <polygon points="20,175 24,188 38,188 27,196 31,210 20,201 9,210 13,196 2,188 16,188" fill="#FFF"/>
    <text x="20" y="224" font-size="10" font-weight="600" fill="#FFF" text-anchor="middle">2041</text>
  </g>

  <!-- Bottom metric pill -->
  <rect x="0" y="595" width="360" height="45" fill="rgba(15, 23, 42, 0.9)" />
  <path d="M 20 617 L 30 611 L 30 623 Z" fill="#06B6D4"/>
  <text x="38" y="621" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" fill="#06B6D4">409.4万 浏览</text>
  
  <rect x="270" y="605" width="75" height="26" rx="6" fill="#0891B2" />
  <text x="307" y="622" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle">发布会热点</text>
</svg>
