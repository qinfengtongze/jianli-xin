<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="100%" height="100%">
  <defs>
    <linearGradient id="skyWin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="50%" stop-color="#F0F9FF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="stitchBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="cardGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="60%" stop-color="rgba(15,23,42,0.4)" />
      <stop offset="100%" stop-color="rgba(15,23,42,0.92)" />
    </linearGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
    <filter id="cardDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Wall & Room Background -->
  <rect width="360" height="640" fill="url(#skyWin)" rx="20" />

  <!-- Window Blind Sunlight Grid Shadows -->
  <g opacity="0.15" stroke="#0369A1" stroke-width="16">
    <line x1="-40" y1="100" x2="400" y2="100" />
    <line x1="-40" y1="160" x2="400" y2="160" />
    <line x1="-40" y1="220" x2="400" y2="220" />
    <line x1="-40" y1="280" x2="400" y2="280" />
    <line x1="120" y1="0" x2="120" y2="360" stroke-width="22" />
    <line x1="240" y1="0" x2="240" y2="360" stroke-width="22" />
  </g>

  <!-- Stitch Plush Toy Silhouette in Background -->
  <g transform="translate(250, 140)" opacity="0.85" filter="url(#softBlur)">
    <ellipse cx="40" cy="50" rx="45" ry="40" fill="#38BDF8" />
    <path d="M 10 25 C -20 -10 -15 -40 10 -20 C 25 -5 20 20 10 25 Z" fill="#0284C7" />
    <path d="M 70 25 C 100 -10 95 -40 70 -20 C 55 -5 60 20 70 25 Z" fill="#0284C7" />
  </g>

  <!-- Female Creator Outline (Artistic & Clean) -->
  <g transform="translate(130, 240)">
    <!-- Body & Lace Cardigan -->
    <path d="M -50 140 C -45 90 -25 70 0 65 C 25 70 45 90 50 140 Z" fill="#FFFFFF" filter="url(#cardDrop)" />
    <path d="M -15 65 L 15 65 L 10 110 L -10 110 Z" fill="#FDE047" opacity="0.3" />
    <!-- Hair & Head -->
    <path d="M -30 20 C -40 60 -45 110 -35 130 C -25 140 -20 100 -20 60 C -15 65 15 65 20 60 C 20 100 25 140 35 130 C 45 110 40 60 30 20 Z" fill="#78350F" />
    <ellipse cx="0" cy="20" rx="24" ry="28" fill="#FCD34D" opacity="0.6" />
    <ellipse cx="0" cy="18" rx="22" ry="26" fill="#FEE2E2" />
    <!-- White Wireless Earbud -->
    <ellipse cx="-21" cy="18" rx="4" ry="7" fill="#FFFFFF" filter="url(#cardDrop)" />
    <path d="M -21 24 L -20 32" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="-21" cy="18" r="1.5" fill="#0284C7" />
  </g>

  <!-- Desk Surface in Foreground -->
  <rect x="0" y="430" width="360" height="210" fill="#F8FAFC" />
  <line x1="0" y1="430" x2="360" y2="430" stroke="#CBD5E1" stroke-width="2" />

  <!-- Laptop on Desk -->
  <g transform="translate(190, 360)">
    <path d="M 0 70 L 140 70 L 120 10 L 20 10 Z" fill="#94A3B8" opacity="0.8" />
    <rect x="-10" y="70" width="160" height="8" rx="3" fill="#64748B" />
    <rect x="28" y="16" width="84" height="50" rx="2" fill="#0F172A" />
  </g>

  <!-- Desk Props: Iced Drink & Stitch Earbuds Case -->
  <g transform="translate(35, 410)">
    <!-- Drink Cup -->
    <path d="M 10 30 L 40 30 L 35 80 L 15 80 Z" fill="#FEF08A" opacity="0.7" />
    <path d="M 12 36 L 38 36 L 34 78 L 16 78 Z" fill="#78350F" opacity="0.8" />
    <line x1="25" y1="10" x2="22" y2="45" stroke="#64748B" stroke-width="3" stroke-linecap="round" />
    <!-- Mini Stitch Plush -->
    <ellipse cx="80" cy="65" rx="20" ry="18" fill="url(#stitchBlue)" />
    <ellipse cx="74" cy="62" rx="3" ry="4" fill="#0F172A" />
    <ellipse cx="86" cy="62" rx="3" ry="4" fill="#0F172A" />
    <!-- Earphone Case -->
    <rect x="110" y="58" width="32" height="24" rx="10" fill="#FFFFFF" stroke="#38BDF8" stroke-width="1.5" filter="url(#cardDrop)" />
    <circle cx="126" cy="70" r="3" fill="#0284C7" />
  </g>

  <!-- Dark Gradient Overlay for High Readability -->
  <rect x="0" y="280" width="360" height="360" fill="url(#cardGlow)" rx="0" />

  <!-- Real Subtitle Text: 点亮一天的快乐 -->
  <g transform="translate(180, 520)">
    <rect x="-110" y="-22" width="220" height="38" rx="10" fill="rgba(0,0,0,0.65)" stroke="rgba(255,255,255,0.2)" />
    <text x="0" y="3" text-anchor="middle" font-family="'PingFang SC', -apple-system, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" letter-spacing="1">
      点亮一天的快乐
    </text>
  </g>

  <!-- Top Feed Badge -->
  <g transform="translate(20, 28)">
    <rect width="110" height="28" rx="14" fill="rgba(15,23,42,0.7)" stroke="rgba(255,255,255,0.2)" />
    <circle cx="14" cy="14" r="4" fill="#38BDF8" />
    <text x="26" y="18" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">
      史迪奇办公日常
    </text>
  </g>

  <!-- Play Pill Icon -->
  <g transform="translate(305, 30)">
    <circle cx="14" cy="14" r="14" fill="rgba(255,255,255,0.25)" />
    <polygon points="12,8 20,14 12,20" fill="#FFFFFF" />
  </g>

  <!-- Bottom Details -->

</svg>