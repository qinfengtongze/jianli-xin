<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_xfold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="35%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="screen_viewfinder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="360" height="640" fill="url(#bg_xfold)" rx="16"/>

  <!-- Top Status Bar -->
  <g fill="#FFFFFF" opacity="0.95">
    <text x="16" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">17:53</text>
    <text x="282" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">5G  95%</text>
    <path d="M 16 48 L 24 56 L 16 64" stroke="#FFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="330" cy="56" r="8" fill="none" stroke="#FFF" stroke-width="2"/>
  </g>

  <!-- Big Overlay Text "再开一点" -->
  <text x="16" y="105" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="38" font-weight="900" fill="#FFFFFF" opacity="0.9" filter="drop-shadow(0px 4px 8px rgba(0,0,0,0.8))">再开一点</text>

  <!-- Large Foldable Phone Held in Hands -->
  <g transform="translate(62, 115)">
    <!-- Unfolded X Fold6 Outer Frame -->
    <rect x="0" y="0" width="220" height="230" rx="16" fill="#0F172A" stroke="#94A3B8" stroke-width="3"/>
    <!-- Fold Hinge Center Line -->
    <line x1="110" y1="0" x2="110" y2="230" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 2"/>

    <!-- Screen Area -->
    <rect x="8" y="8" width="204" height="214" rx="10" fill="url(#screen_viewfinder)"/>

    <!-- Girl Portrait inside Camera Viewfinder -->
    <g transform="translate(110, 105)">
      <!-- Face & Shoulders -->
      <path d="M -40 80 Q -30 15, 0 8 Q 30 15, 40 80 Z" fill="#FCE7F3"/>
      <circle cx="0" cy="-10" r="30" fill="#FCD34D"/>
      <!-- Eyes & Smiling Lips -->
      <circle cx="-12" cy="-14" r="3" fill="#1E293B"/>
      <circle cx="12" cy="-14" r="3" fill="#1E293B"/>
      <path d="M -10 2 C -5 10, 5 10, 10 2" stroke="#E11D48" stroke-width="3" fill="#E11D48"/>
      <!-- Hair -->
      <path d="M -36 -18 C -33 -50, 33 -50, 36 -18 C 28 18, -28 18, -36 -18 Z" fill="#0F172A"/>
    </g>

    <!-- Camera Viewfinder Focus Box -->
    <rect x="75" y="70" width="70" height="70" fill="none" stroke="#FACC15" stroke-width="2" stroke-dasharray="4 4"/>

    <!-- Hands Holding Phone -->
    <path d="M -25 90 C -12 70, 0 100, -5 140 C -12 180, -30 195, -40 160 Z" fill="#E2A988"/>
    <path d="M 245 90 C 232 70, 220 100, 225 140 C 232 180, 250 195, 260 160 Z" fill="#E2A988"/>
  </g>

  <!-- Captions & Subtitles -->
  <g transform="translate(16, 420)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11.5" font-weight="800" fill="#CBD5E1">机圈大事件 · 06-26</text>
    <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">还好有XFold6 #人类对折叠</text>
    <text x="0" y="36" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">屏的开发不足百分之一 #v...</text>
  </g>

  <!-- Comment Bubble -->
  <g transform="translate(16, 480)">
    <rect x="0" y="0" width="220" height="46" rx="14" fill="rgba(30, 30, 35, 0.76)"/>
    <circle cx="18" cy="23" r="10" fill="#F43F5E"/>
    <text x="36" y="19" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="10.5" fill="#A1A1AA">长安彼氏:</text>
    <text x="36" y="34" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">打游戏会不会很重 🎮</text>
  </g>

  <!-- Search Tag -->
  <text x="16" y="560" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11.5" font-weight="600" fill="#E2E8F0">🔍 相关搜索 · vivoXFold6</text>

  <!-- Right Sidebar Engagement Controls -->
  <g transform="translate(302, 230)">
    <circle cx="20" cy="20" r="18" fill="#FFDC00" stroke="#FFF" stroke-width="2"/>
    <text x="20" y="24" font-size="9" font-weight="900" fill="#000" text-anchor="middle">机圈</text>

    <path d="M 20 70 C 10 55, 0 70, 20 88 C 40 70, 30 55, 20 70 Z" fill="#FFF"/>
    <text x="20" y="100" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#FFF" text-anchor="middle">6559</text>

    <circle cx="20" cy="128" r="12" fill="#FFF"/>
    <text x="20" y="152" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#FFF" text-anchor="middle">123</text>

    <polygon points="20,174 24,184 35,184 26,191 29,202 20,195 11,202 14,191 5,184 16,184" fill="#FFF"/>
    <text x="20" y="216" font-family="sans-serif" font-size="10.5" font-weight="700" fill="#FFF" text-anchor="middle">392</text>
  </g>

  <!-- Bottom Toolbar Banner (PROMINENT PLAY COUNT AT BOTTOM) -->
  <g transform="translate(0, 588)">
    <rect width="360" height="52" fill="#0A0B10"/>
    <line x1="0" y1="0" x2="360" y2="0" stroke="#27272A" stroke-width="1"/>

    <!-- Play Count -->
    <path d="M 16 26 L 26 19 L 26 33 Z" fill="#FFFFFF"/>
    <text x="32" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">233.7万浏览</text>

    <!-- Video Analysis Pill -->
    <rect x="156" y="12" width="130" height="28" rx="8" fill="#27272A"/>
    <text x="221" y="30" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11" font-weight="700" fill="#E4E4E7" text-anchor="middle">📊 视频分析  ^</text>

    <!-- Public Badge -->
    <rect x="294" y="12" width="52" height="28" rx="8" fill="#27272A"/>
    <text x="320" y="30" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11" font-weight="700" fill="#E4E4E7" text-anchor="middle">公开</text>
  </g>
</svg>
