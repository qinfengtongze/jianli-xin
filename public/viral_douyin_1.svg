<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D4A21" />
      <stop offset="50%" stop-color="#1B2E14" />
      <stop offset="100%" stop-color="#0F1A0B" />
    </linearGradient>
    <linearGradient id="phoneBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2DDF5" />
      <stop offset="100%" stop-color="#C5BFE3" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="360" height="640" fill="url(#bg1)" rx="16" />

  <!-- Soft bokeh circles in background -->
  <circle cx="80" cy="120" r="90" fill="#4A7A32" opacity="0.4" />
  <circle cx="280" cy="220" r="110" fill="#3D6B28" opacity="0.3" />
  <circle cx="150" cy="480" r="130" fill="#2E4F1F" opacity="0.5" />

  <!-- Top status bar -->
  <text x="20" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">17:54</text>
  <text x="310" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">5G 95%</text>

  <!-- Back button & search icon -->
  <path d="M 28 55 L 18 65 L 28 75" stroke="#FFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <circle cx="330" cy="65" r="8" stroke="#FFF" stroke-width="2" fill="none"/>
  <line x1="336" y1="71" x2="342" y2="77" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>

  <!-- Phone in hand -->
  <g transform="translate(60, 200) rotate(-12)" filter="url(#shadow)">
    <!-- Hand outline/silhouette behind phone -->
    <path d="M -10 180 Q 20 140 30 110 T 35 220 Z" fill="#D3A286" opacity="0.8"/>
    
    <!-- Phone body -->
    <rect x="20" y="0" width="160" height="310" rx="24" fill="url(#phoneBack)" stroke="#A99FE0" stroke-width="1.5" />
    
    <!-- Camera module -->
    <rect x="50" y="20" width="100" height="95" rx="20" fill="#1A1829" />
    <circle cx="75" cy="48" r="16" fill="#0A0914" stroke="#332E52" stroke-width="2"/>
    <circle cx="75" cy="48" r="10" fill="#020817"/>
    <circle cx="125" cy="48" r="16" fill="#0A0914" stroke="#332E52" stroke-width="2"/>
    <circle cx="125" cy="48" r="10" fill="#020817"/>
    <circle cx="75" cy="85" r="14" fill="#0A0914" stroke="#332E52" stroke-width="2"/>
    <circle cx="125" cy="85" r="5" fill="#E2DDF5" opacity="0.9"/>
  </g>

  <!-- Overlay text & subtitles -->
  <rect x="20" y="380" width="220" height="42" rx="12" fill="rgba(0,0,0,0.55)" />
  <text x="32" y="398" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11" fill="#E2E8F0">树叶...:</text>
  <text x="32" y="414" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11" font-weight="600" fill="#FFF">我只剩五百了我也好想要OPPO Find X9 Pro啊</text>

  <text x="60" y="450" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="19" font-weight="900" fill="#FFF" filter="drop-shadow(0px 2px 4px rgba(0,0,0,0.8))">我真买上手体验了</text>

  <rect x="20" y="470" width="190" height="45" rx="12" fill="rgba(0,0,0,0.55)" />
  <text x="32" y="488" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11" fill="#E2E8F0">梦日:</text>
  <text x="32" y="504" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11" font-weight="600" fill="#FFF">很好的一款手机，介绍很详细 👍</text>

  <!-- Right sidebar buttons (Douyin style) -->
  <g transform="translate(305, 260)">
    <!-- Avatar -->
    <circle cx="20" cy="20" r="18" fill="#FFDC00" stroke="#FFF" stroke-width="2"/>
    <text x="20" y="24" font-size="9" font-weight="bold" fill="#000" text-anchor="middle">机圈</text>

    <!-- Like -->
    <path d="M 20 70 C 10 55, 0 70, 20 88 C 40 70, 30 55, 20 70 Z" fill="#FFF"/>
    <text x="20" y="102" font-size="10" font-weight="600" fill="#FFF" text-anchor="middle">2.9万</text>

    <!-- Comment -->
    <circle cx="20" cy="130" r="14" fill="#FFF"/>
    <text x="20" y="156" font-size="10" font-weight="600" fill="#FFF" text-anchor="middle">1371</text>

    <!-- Favorite -->
    <polygon points="20,175 24,188 38,188 27,196 31,210 20,201 9,210 13,196 2,188 16,188" fill="#FFF"/>
    <text x="20" y="224" font-size="10" font-weight="600" fill="#FFF" text-anchor="middle">5210</text>
  </g>

  <!-- Bottom metric pill -->
  <rect x="0" y="595" width="360" height="45" fill="rgba(15, 23, 42, 0.9)" />
  <path d="M 20 617 L 30 611 L 30 623 Z" fill="#38BDF8"/>
  <text x="38" y="621" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="800" fill="#38BDF8">996.9万 浏览</text>
  
  <rect x="270" y="605" width="75" height="26" rx="6" fill="#2563EB" />
  <text x="307" y="622" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="11" font-weight="bold" fill="#FFF" text-anchor="middle">爆款实测</text>
</svg>
