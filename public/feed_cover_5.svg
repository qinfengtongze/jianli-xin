<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="100%" height="100%">
  <defs>
    <linearGradient id="skyBlueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
    <linearGradient id="waterMirror" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="cardGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="60%" stop-color="rgba(15,23,42,0.4)" />
      <stop offset="100%" stop-color="rgba(15,23,42,0.95)" />
    </linearGradient>
    <filter id="cloudBlur">
      <feGaussianBlur stdDeviation="14" />
    </filter>
    <filter id="dropShad" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0369A1" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Sky Backdrop -->
  <rect width="360" height="400" fill="url(#skyBlueGrad)" rx="20" />

  <!-- Soft Fluffy White Clouds -->
  <ellipse cx="90" cy="80" rx="70" ry="35" fill="#FFFFFF" opacity="0.7" filter="url(#cloudBlur)" />
  <ellipse cx="270" cy="120" rx="90" ry="40" fill="#FFFFFF" opacity="0.65" filter="url(#cloudBlur)" />

  <!-- Stitch Plush Figurine in Bokeh Background -->
  <g transform="translate(250, 160)" opacity="0.75" filter="url(#cloudBlur)">
    <ellipse cx="40" cy="45" rx="40" ry="36" fill="#0284C7" />
    <path d="M 10 20 C -20 -10 -15 -35 10 -15 Z" fill="#0369A1" />
    <path d="M 70 20 C 100 -10 95 -35 70 -15 Z" fill="#0369A1" />
  </g>

  <!-- Reflective Water Table Surface -->
  <rect x="0" y="370" width="360" height="270" fill="url(#waterMirror)" />
  <line x1="0" y1="370" x2="360" y2="370" stroke="#E0F2FE" stroke-width="2" />

  <!-- Stitch Custom Earphone Charging Case (Macro Solo Shot) -->
  <g transform="translate(180, 320)" filter="url(#dropShad)">
    <!-- Top Lid & Base of Case -->
    <rect x="-75" y="-50" width="150" height="120" rx="42" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    <line x1="-75" y1="10" x2="75" y2="10" stroke="#38BDF8" stroke-width="3" />
    
    <!-- Printed Stitch IP Artwork -->
    <text x="0" y="-12" text-anchor="middle" font-family="'Comic Sans MS', cursive, sans-serif" font-size="20" font-weight="bold" fill="#0284C7" letter-spacing="2">
      Stitch
    </text>
    <!-- Cute Stitch Graphic on Case -->
    <ellipse cx="-25" cy="52" rx="18" ry="16" fill="#38BDF8" />
    <ellipse cx="-25" cy="46" rx="14" ry="12" fill="#0284C7" />
    <!-- Music Notes Around Stitch -->
    <path d="M 10 40 L 15 35 L 15 50 M 15 50 A 4 4 0 1 1 10 48" stroke="#F43F5E" stroke-width="2" fill="none" />
    <path d="M 32 46 L 37 41 L 37 56 M 37 56 A 4 4 0 1 1 32 54" stroke="#F43F5E" stroke-width="2" fill="none" />
    <!-- Status LED -->
    <rect x="-6" y="80" width="12" height="4" rx="2" fill="#94A3B8" />
  </g>

  <!-- Clear Glass Mirror Reflection of the Case -->
  <g transform="translate(180, 470) scale(1, -0.6)" opacity="0.35" filter="url(#cloudBlur)">
    <rect x="-75" y="-50" width="150" height="120" rx="42" fill="#FFFFFF" />
    <text x="0" y="-12" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0284C7">
      Stitch
    </text>
  </g>

  <rect x="0" y="280" width="360" height="360" fill="url(#cardGlow)" />

  <!-- Subtitle Text: 经典的史迪奇IP -->
  <g transform="translate(180, 520)">
    <rect x="-110" y="-22" width="220" height="38" rx="10" fill="rgba(0,0,0,0.65)" stroke="rgba(255,255,255,0.2)" />
    <text x="0" y="3" text-anchor="middle" font-family="'PingFang SC', -apple-system, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" letter-spacing="1">
      经典的史迪奇IP
    </text>
  </g>

  <!-- Top Badge -->
  <g transform="translate(20, 28)">
    <rect width="110" height="28" rx="14" fill="rgba(15,23,42,0.7)" stroke="rgba(255,255,255,0.2)" />
    <circle cx="14" cy="14" r="4" fill="#38BDF8" />
    <text x="26" y="18" font-family="-apple-system, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">
      潮玩IP微距特写
    </text>
  </g>

  <!-- Play Pill Icon -->
  <g transform="translate(305, 30)">
    <circle cx="14" cy="14" r="14" fill="rgba(255,255,255,0.25)" />
    <polygon points="12,8 20,14 12,20" fill="#FFFFFF" />
  </g>


</svg>